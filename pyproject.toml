[project]
name = "datapilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "paul1231231", email = "pokpokli557@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "crewai[litellm]>=1.15.41",
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "psycopg>=3.3.9",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
    "sqlglot>=30.31.0",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
datapilot = "datapilot:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
