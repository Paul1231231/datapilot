name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  DATABASE_URL: postgresql+psycopg://datapilot:datapilot_dev@localhost:5432/datapilot

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Pytest (unit + evaluation)
        run: uv run pytest tests/unit tests/evaluation -v

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: datapilot
          POSTGRES_PASSWORD: datapilot_dev
          POSTGRES_DB: datapilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datapilot -d datapilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Apply database schema
        env:
          PGPASSWORD: datapilot_dev
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql -h localhost -U datapilot -d datapilot -v ON_ERROR_STOP=1 \
            -f src/datapilot/database/schema.sql

      - name: Seed synthetic sales data
        run: uv run python scripts/seed_database.py

      - name: Pytest (integration)
        run: uv run pytest tests/integration -v -m integration